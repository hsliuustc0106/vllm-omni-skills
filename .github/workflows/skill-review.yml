# Tessl Skill Review — runs on PRs that change any SKILL.md; posts scores as one PR comment.
# Docs: https://github.com/tesslio/skill-review
name: Tessl Skill Review

on:
  pull_request:
    branches: [main]
    paths:
      - "**/SKILL.md"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      TESSL_TOKEN_AVAILABLE: ${{ secrets.TESSL_API_TOKEN != '' || secrets.TESSL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review@main
        if: env.TESSL_TOKEN_AVAILABLE == 'true'
        with:
          tessl-token: ${{ secrets.TESSL_API_TOKEN || secrets.TESSL_TOKEN }}
      - name: Skip Tessl Skill Review
        if: env.TESSL_TOKEN_AVAILABLE != 'true'
        run: echo "::notice::Skipping Tessl Skill Review because neither TESSL_API_TOKEN nor TESSL_TOKEN is configured."
